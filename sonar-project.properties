# ==============================================================================
# SonarQube Project Configuration
# IoT-Based Smart Energy Monitoring and Management System
# ==============================================================================

# Project Identification
sonar.projectKey=iot-smart-energy-monitoring
sonar.projectName=IoT Smart Energy Monitoring System
sonar.projectVersion=1.0.0

# Source Code & Language Settings
sonar.sources=.
sonar.sourceEncoding=UTF-8
sonar.python.version=3.11, 3.12, 3.13

# Exclusions from Code Quality & Security Analysis
# Excludes test definitions, reports, terraform IaC, and local runtime databases
sonar.exclusions=tests/**, REPORT_MATERIALS/**, terraform/**, data/**, security/**, **/*.pyc, **/.pytest_cache/**, **/__pycache__/**

# Unit Test Settings
sonar.tests=tests
sonar.test.inclusions=tests/**/test_*.py

# Test Execution & Code Coverage Reports (generated via pytest --cov --cov-report=xml)
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=results.xml

# Quality Gate Defaults
sonar.qualitygate.wait=true
