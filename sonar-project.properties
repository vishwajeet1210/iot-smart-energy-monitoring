# ==============================================================================
# SonarQube Project Configuration
# IoT-Based Smart Energy Monitoring and Management System
# ==============================================================================

# Project Identification
sonar.organization=vishwajeet1210
sonar.projectKey=iot-smart-energy-monitoring
sonar.projectName=IoT Smart Energy Monitoring System
sonar.projectVersion=1.0.0

# Source Code & Language Settings
sonar.sources=.
sonar.sourceEncoding=UTF-8
sonar.python.version=3.11, 3.12, 3.13

# Exclusions from Code Quality & Security Analysis
# Excludes test definitions, reports, local runtime databases, utility scripts, and cache directories
sonar.exclusions=tests/**, REPORT_MATERIALS/**, data/**, security/**, scripts/**, **/*.pyc, **/.pytest_cache/**, **/__pycache__/**

# Coverage exclusions: explicitly exclude non-production documentation/utility scripts from coverage calculations
sonar.coverage.exclusions=scripts/**

# Unit Test Settings
sonar.tests=tests
sonar.test.inclusions=tests/**/test_*.py

# Test Execution & Code Coverage Reports (generated via pytest --cov --cov-report=xml)
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=results.xml

# Quality Gate Defaults
sonar.qualitygate.wait=true
