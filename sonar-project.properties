# ==============================================================================
# SonarQube Project Configuration
# IoT-Based Smart Energy Monitoring and Management System
# ==============================================================================

# Project Identification
sonar.organization=vishwajeet1210
sonar.projectKey=iot-smart-energy-monitoring
sonar.projectName=IoT Smart Energy Monitoring System
sonar.projectVersion=1.0.0

# Source Code & Language Settings
sonar.sources=.
sonar.sourceEncoding=UTF-8
sonar.python.version=3.11,3.12,3.13

# Source exclusions
sonar.exclusions=tests/**,REPORT_MATERIALS/**,data/**,security/**,scripts/**,**/*.pyc,**/.pytest_cache/**,**/__pycache__/**
# Coverage exclusions
sonar.coverage.exclusions=scripts/**

# Unit Test Settings
sonar.tests=tests
sonar.test.inclusions=tests/**/test_*.py

# Test and Coverage Reports
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=results.xml

# Wait for the remote Quality Gate result
sonar.qualitygate.wait=true
